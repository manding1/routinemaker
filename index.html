<style>
  :root{
    --grape:#4C7A1C;
    --grape-deep:#375913;
    --grape-focus:#5A9C24;
    --grape-tint:#EAF3DC;
    --ink:#1D1D1F;
    --body-muted:#6E6E73;
    --canvas:#FFFFFF;
    --canvas-soft:#F5F5F7;
    --canvas-recessed:#EEECF1;
    --hairline:#E0E0E0;
    --on-grape:#FFFFFF;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Inter, system-ui, sans-serif;
    --space-xs:8px;
    --space-sm:12px;
    --space-md:16px;
    --space-lg:24px;
    --space-xl:32px;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
    --radius-pill:9999px;
  }
  *, *::before, *::after{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--canvas-soft);
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button, input, textarea{
    font:inherit;
    color:inherit;
    background:none;
    border:none;
    -webkit-appearance:none;
    appearance:none;
    outline-offset:2px;
  }
  button{ cursor:pointer; }

  /* Typography (DESIGN.md tokens) */
  .title{ font-family:var(--font); font-size:24px; font-weight:600; line-height:1.2; letter-spacing:-0.2px; color:var(--ink); margin:0; }
  .body{ font-family:var(--font); font-size:17px; font-weight:400; line-height:1.47; letter-spacing:-0.2px; color:var(--ink); margin:0; }
  .caption{ font-family:var(--font); font-size:14px; font-weight:400; line-height:1.4; letter-spacing:-0.1px; color:var(--body-muted); margin:0; }
  .micro{ font-family:var(--font); font-size:12px; font-weight:400; line-height:1.3; letter-spacing:0; color:var(--body-muted); margin:0; }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--canvas);
    padding: var(--space-lg) var(--space-md) 64px;
  }
  #app.view-review, #app.view-pastList, #app.view-pastDetail{
    background:var(--canvas-soft);
  }

  /* Empty state (first launch) */
  .empty-screen{
    min-height:80vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:var(--space-lg);
    padding:var(--space-xl) var(--space-md);
  }

  /* Home header */
  .home-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--space-sm);
    margin-bottom:var(--space-xs);
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:var(--space-sm);
    flex-shrink:0;
  }
  .summary-line{ margin-bottom:var(--space-md); }
  .home-tabs{
    display:flex;
    gap:var(--space-sm);
    margin-bottom:var(--space-md);
  }
  .home-tab-btn{
    flex:1;
    min-height:44px;
    background:var(--canvas);
    color:var(--grape);
    border:1.5px solid var(--grape);
    font-family:var(--font);
    font-size:17px;
    font-weight:600;
    text-align:center;
    border-radius:var(--radius-lg);
    padding:11px 16px;
  }
  .home-tab-btn-active{
    background:var(--grape);
    color:var(--on-grape);
  }

  .btn-primary{
    display:block;
    width:100%;
    min-height:44px;
    background:var(--grape);
    color:var(--on-grape);
    font-family:var(--font);
    font-size:17px;
    font-weight:400;
    text-align:center;
    border-radius:var(--radius-pill);
    padding:11px 22px;
  }
  .btn-compact{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:36px;
    background:var(--grape);
    color:var(--on-grape);
    font-family:var(--font);
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    border-radius:var(--radius-pill);
    padding:8px 14px;
  }
  .btn-secondary{
    display:block;
    width:100%;
    min-height:44px;
    background:transparent;
    color:var(--ink);
    border:1px solid var(--hairline);
    font-family:var(--font);
    font-size:17px;
    text-align:center;
    border-radius:var(--radius-pill);
    padding:11px 22px;
  }
  .finish-btn{ margin-top:var(--space-sm); }

  .link-btn{
    min-height:44px;
    padding:8px 4px;
    color:var(--body-muted);
    font-family:var(--font);
    font-size:14px;
  }

  /* Cluster cards */
  .cluster-list{
    display:flex;
    flex-direction:column;
    gap:var(--space-lg);
    margin-bottom:var(--space-xl);
  }
  .cluster-card{
    background:var(--canvas);
    border-radius:var(--radius-lg);
    padding:var(--space-lg) var(--space-md);
  }
  .cluster-card + .cluster-card{
    border-top:1px solid var(--hairline);
  }
  .cluster-card-header{
    display:flex;
    align-items:center;
    gap:var(--space-xs);
    margin-bottom:var(--space-sm);
  }
  .cluster-name{ flex:1; text-align:center; margin-bottom:0; word-break:break-word; }
  .cluster-header-spacer{ width:44px; height:44px; flex-shrink:0; }
  .grape-caption{ text-align:center; margin-top:var(--space-xs); }

  /* 젤리주머니 reorder ("편집") mode */
  .cluster-edit-list{
    display:flex;
    flex-direction:column;
    gap:var(--space-sm);
  }
  .cluster-edit-row{
    display:flex;
    align-items:center;
    gap:var(--space-sm);
    background:var(--canvas);
    border:1px solid var(--hairline);
    border-radius:var(--radius-lg);
    padding:var(--space-md);
    min-height:44px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    cursor:grab;
  }
  .cluster-edit-row.dragging{
    box-shadow:0 8px 20px rgba(0,0,0,0.18);
    cursor:grabbing;
    position:relative;
    z-index:5;
  }
  .cluster-edit-name{ flex:1; word-break:break-word; }
  .cluster-edit-count{ flex-shrink:0; }
  .drag-handle{
    flex-shrink:0;
    color:var(--body-muted);
    font-size:20px;
    line-height:1;
  }

  .grape-grid{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:var(--space-xs);
  }
  .grape-row{
    display:flex;
    gap:var(--space-xs);
    justify-content:center;
  }
  .grape-slot{
    width:44px;
    height:44px;
    border-radius:var(--radius-pill);
    padding:0;
    flex-shrink:0;
  }
  .grape-slot.grape-empty{
    background:transparent;
    border:1.5px solid var(--hairline);
  }
  .grape-slot.grape-filled{
    background-size:140%;
    background-position:center;
    background-repeat:no-repeat;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.22);
    border:none;

  .step-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:var(--space-xs);
    margin-top:var(--space-md);
  }
  .step-text{ flex:1; word-break:break-word; }
  .step-row-input .step-input{
    flex:1;
    min-height:44px;
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    padding:10px 14px;
    background:var(--canvas);
  }
  .pending-steps-label{ margin-top:var(--space-md); margin-bottom:var(--space-xs); }
  .pending-steps{
    display:flex;
    flex-direction:column;
    gap:var(--space-xs);
  }
  .step-toggle{
    width:52px;
    height:44px;
    flex-shrink:0;
    border-radius:var(--radius-pill);
    border:1.5px solid var(--hairline);
    background:transparent;
    color:transparent;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .step-toggle-on{
    border:none;
    background:var(--grape);
    color:var(--on-grape);
  }
  .complete-row{
    display:flex;
    align-items:stretch;
    gap:var(--space-xs);
    margin-top:var(--space-md);
  }
  .complete-row-stacked{ flex-direction:column; }
  .complete-row .step-complete-cta{ flex:1; margin-top:0; }
  .step-cancel-btn-solo{ flex:1; margin-top:0; color:var(--body-muted); }
  .step-graduate-btn{ margin-top:0; }
  .step-confirm-btn{
    width:44px;
    height:44px;
    flex-shrink:0;
    border-radius:var(--radius-pill);
    background:var(--grape);
    color:var(--on-grape);
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .overflow-btn{
    position:relative;
    width:44px;
    height:44px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--body-muted);
    font-size:20px;
    letter-spacing:2px;
  }
  /* Small dot marking a saved 메모 — the app's one state-indicator glyph,
     kept to the single accent color per DESIGN.md's "one accent" rule. */
  .overflow-btn.has-memo::after{
    content:"";
    position:absolute;
    top:6px;
    right:6px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--grape);
  }

  /* Checklist */
  .checklist-section{
    background:var(--canvas-recessed);
    border-radius:var(--radius-lg);
    padding:var(--space-md);
    margin-bottom:var(--space-xl);
  }
  .section-label{ margin-bottom:var(--space-sm); }
  .checklist-rows{
    display:flex;
    flex-direction:column;
    gap:var(--space-xs);
  }
  .checklist-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:44px;
    background:var(--canvas);
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    padding:12px var(--space-md);
    text-align:left;
    gap:var(--space-xs);
  }
  .checklist-row-checked{ background:var(--grape-tint); }
  .checklist-row-locked{ background:var(--canvas-soft); border-color:transparent; }
  .checklist-name{ flex:1; word-break:break-word; }
  .checklist-status{
    width:22px;
    height:22px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    border:1.5px solid var(--hairline);
    background:var(--canvas);
    color:var(--on-grape);
    font-size:13px;
    font-weight:700;
  }
  .checklist-status-checked{
    border-color:transparent;
    background:var(--grape-focus);
  }

  /* Toasts */
  #toast-region{
    position:fixed;
    left:0; right:0; bottom:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:var(--space-xs);
    pointer-events:none;
    z-index:1000;
    padding:0 var(--space-md);
  }
  .toast-celebration{
    background:var(--ink);
    color:var(--canvas);
    font-family:var(--font);
    font-size:14px;
    line-height:1.4;
    letter-spacing:-0.1px;
    border-radius:var(--radius-pill);
    padding:10px 18px;
    max-width:100%;
    text-align:center;
    opacity:0;
    transition:opacity .25s ease;
  }
  .toast-celebration.toast-visible{ opacity:1; }

  /* Modals */
  .modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.32);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:2000;
  }
  .modal-sheet{
    width:100%;
    max-width:480px;
    background:var(--canvas);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    padding:var(--space-lg) var(--space-md) calc(var(--space-lg) + env(safe-area-inset-bottom, 0px));
  }
  .modal-sheet .title{ margin-bottom:var(--space-md); }
  .modal-sheet .title + .body{ margin-bottom:var(--space-sm); }
  .memo-sheet{ display:flex; flex-direction:column; max-height:80vh; }
  .memo-entries{
    overflow-y:auto;
    margin-bottom:var(--space-md);
  }
  .memo-entry{ margin-bottom:var(--space-md); }
  .memo-entry-date{ display:block; margin-bottom:var(--space-xs); }
  .memo-entry-box{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:var(--space-xs);
    background:var(--canvas);
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    padding:12px 14px;
  }
  .memo-entry-text{ flex:1; white-space:pre-wrap; word-break:break-word; }
  .memo-sheet textarea{ margin-top:0; }
  .modal-checkbox-group{
    display:flex;
    flex-wrap:wrap;
    gap:0 var(--space-md);
  }
  .modal-checkbox-row{
    display:flex;
    align-items:center;
    gap:var(--space-xs);
    min-height:44px;
  }
  .modal-checkbox-row input[type="checkbox"]{
    width:20px;
    height:20px;
    flex-shrink:0;
    accent-color:var(--grape);
  }
  .modal-actions{ display:flex; gap:var(--space-sm); margin-top:var(--space-sm); }
  .modal-actions > *{ flex:1; }
  .action-sheet{ padding-top:var(--space-sm); }
  .sheet-btn{
    display:block;
    width:100%;
    min-height:52px;
    text-align:center;
    padding:14px;
    font-family:var(--font);
    font-size:17px;
    color:var(--ink);
    border-top:1px solid var(--hairline);
  }
  .action-sheet .sheet-btn:first-child{ border-top:none; }
  .sheet-btn-muted{ color:var(--body-muted); }
  .sheet-btn-cancel{ font-weight:600; }

  .text-input, textarea{
    display:block;
    width:100%;
    min-height:44px;
    border:1px solid var(--hairline);
    border-radius:var(--radius-md);
    padding:12px 14px;
    margin:var(--space-md) 0;
    background:var(--canvas);
  }
  textarea{ min-height:88px; resize:vertical; }

  /* Review screens */
  .review-header{
    display:flex;
    align-items:center;
    gap:var(--space-xs);
    margin-bottom:var(--space-md);
  }
  .review-header .link-btn{ font-size:20px; color:var(--ink); }
  .review-field-card{
    background:var(--canvas);
    border-radius:var(--radius-lg);
    padding:var(--space-md);
    margin-bottom:var(--space-md);
  }
  .review-field-card .caption{ display:block; margin-bottom:var(--space-xs); }
  .review-field-card textarea{ margin:0; }
  .review-readonly{ white-space:pre-wrap; word-break:break-word; }
  .review-save-btn{ margin-top:var(--space-sm); }
  .empty-hint{ color:var(--body-muted); padding:var(--space-lg) 0; text-align:center; }
  .past-list-rows{ display:flex; flex-direction:column; gap:var(--space-xs); }
  .past-list-row{ width:100%; }

  /* Press feedback (EXPERIENCE.md motion, locked minimal) */
  .btn-primary, .btn-secondary, .btn-compact, .grape-slot, .checklist-row, .overflow-btn,
  .step-confirm-btn, .step-toggle, .sheet-btn, .past-list-row, .link-btn, .home-tab-btn{
    transition: transform .1s ease;
  }
  .btn-primary:active, .btn-secondary:active, .btn-compact:active, .grape-slot:active, .checklist-row:active,
  .overflow-btn:active, .step-confirm-btn:active, .step-toggle:active, .sheet-btn:active, .past-list-row:active,
  .home-tab-btn:active{
    transform: scale(0.95);
  }

  @media (prefers-reduced-motion: reduce){
    *{
      transition:none !important;
      animation:none !important;
    }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-region" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------------
   * Constants
   * ------------------------------------------------------------------- */
  var STORAGE_KEY = "manding:v1";
  var MAX_GRAPES = 20;
  var GRAPE_ROWS = [4, 4, 4, 4, 4];
  var JELLY_VARIANT_COUNT = 3;

  /* ---------------------------------------------------------------------
   * Date utilities (local calendar date, YYYY-MM-DD)
   * ------------------------------------------------------------------- */
  function pad2(n){ return String(n).padStart(2, "0"); }
  function dateToStr(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function todayStr(){ return dateToStr(new Date()); }
  function yesterdayOf(dateStr){
    var parts = dateStr.split("-").map(Number);
    var dt = new Date(parts[0], parts[1] - 1, parts[2]);
    dt.setDate(dt.getDate() - 1);
    return dateToStr(dt);
  }
  function addDays(dateStr, n){
    var parts = dateStr.split("-").map(Number);
    var dt = new Date(parts[0], parts[1] - 1, parts[2]);
    dt.setDate(dt.getDate() + n);
    return dateToStr(dt);
  }
  function formatDateKo(dateStr){
    var parts = dateStr.split("-").map(Number);
    return parts[0] + "년 " + parts[1] + "월 " + parts[2] + "일";
  }
  function formatDateDots(dateStr){
    return dateStr.split("-").join(".");
  }

  /* ---------------------------------------------------------------------
   * Escaping helper (defensive: cluster names / steps / review text are
   * user-authored and injected via innerHTML)
   * ------------------------------------------------------------------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c];
    });
  }

  function genId(){
    return "c_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function randomJellyVariant(){
    return Math.floor(Math.random() * JELLY_VARIANT_COUNT);
  }

  /* ---------------------------------------------------------------------
   * State (data layer) — all persisted, date-keyed where FR-4/8/9/10/19
   * depend on historical accuracy.
   * ------------------------------------------------------------------- */
  function defaultState(){
    return {
      version: 1,
      clusters: [],       // { id, name, grapeCount, grapeDates, grapeVariants, pendingSteps: [{id, text, doneDate}], lastFilledDate, graduated, lastCheckedDate, createdAt, memoEntries: [{id, date, text}] }
      dailyTotals: {},     // { 'YYYY-MM-DD': number } — distinct clusters that earned a grape that day (FR-8)
      allTimeMax: 0,        // highest dailyTotal ever recorded (FR-10)
      dailyToast: {},       // { 'YYYY-MM-DD': { surpassedShown: bool, recordShown: bool } } — FR-9/FR-10 once-per-day gates
      reviews: {},            // { 'YYYY-MM-DD': { good, improve, gratitude, affirmation, savedAt } }
      skipConfirmUntil: null  // 'YYYY-MM-DD' — while today <= this, the completion-confirm modal is skipped entirely
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var d = defaultState();
      var clusters = (Array.isArray(parsed.clusters) ? parsed.clusters : d.clusters).map(function(c){
        var pendingSteps = Array.isArray(c.pendingSteps) ? c.pendingSteps : [];
        // Legacy single-currentStep clusters (pre-checklist) migrate their one step into the queue.
        if (pendingSteps.length === 0 && typeof c.currentStep === "string" && c.currentStep.trim()){
          pendingSteps = [{ id: genId(), text: c.currentStep.trim(), doneDate: null }];
        }
        // Backfill `doneDate` on steps saved before the personal-toggle field existed
        // (including the older boolean `done` shape, which had no date to reset by —
        // those just come back unchecked, which is what a reset would produce anyway).
        pendingSteps = pendingSteps.map(function(s){
          return { id: s.id, text: s.text, doneDate: typeof s.doneDate === "string" ? s.doneDate : null };
        });
        c.pendingSteps = pendingSteps;

        // Backfill grapeDates to match grapeCount 1:1 — grapes earned before this
        // feature existed have no recorded date, so those slots stay null (shown
        // without a date in the earned-grape message rather than a guessed one).
        var grapeDates = Array.isArray(c.grapeDates) ? c.grapeDates.slice(0, c.grapeCount) : [];
        while (grapeDates.length < c.grapeCount) grapeDates.push(null);
        c.grapeDates = grapeDates;

        // Backfill grapeVariants (which of the 3 jelly images each filled slot
        // shows) to match grapeCount 1:1 — slots earned before this feature
        // existed just get a random look assigned once, same spirit as the
        // null-date backfill above.
        var grapeVariants = Array.isArray(c.grapeVariants) ? c.grapeVariants.slice(0, c.grapeCount) : [];
        while (grapeVariants.length < c.grapeCount) grapeVariants.push(randomJellyVariant());
        c.grapeVariants = grapeVariants;

        // Migrate the old single free-text memo into a dated log: one entry,
        // dated at cluster creation since the original text had no date of its
        // own. Already-migrated clusters keep their existing memoEntries as-is.
        if (Array.isArray(c.memoEntries)){
          c.memoEntries = c.memoEntries.map(function(m){
            return { id: typeof m.id === "string" ? m.id : genId(), date: typeof m.date === "string" ? m.date : c.createdAt, text: String(m.text || "") };
          });
        } else if (typeof c.memo === "string" && c.memo.trim()){
          c.memoEntries = [{ id: genId(), date: c.createdAt, text: c.memo.trim() }];
        } else {
          c.memoEntries = [];
        }
        delete c.memo;

        return c;
      });
      return {
        version: 1,
        clusters: clusters,
        dailyTotals: (parsed.dailyTotals && typeof parsed.dailyTotals === "object") ? parsed.dailyTotals : d.dailyTotals,
        allTimeMax: typeof parsed.allTimeMax === "number" ? parsed.allTimeMax : d.allTimeMax,
        dailyToast: (parsed.dailyToast && typeof parsed.dailyToast === "object") ? parsed.dailyToast : d.dailyToast,
        reviews: (parsed.reviews && typeof parsed.reviews === "object") ? parsed.reviews : d.reviews,
        skipConfirmUntil: typeof parsed.skipConfirmUntil === "string" ? parsed.skipConfirmUntil : d.skipConfirmUntil
      };
    }catch(e){
      console.warn("MANDING: failed to load saved state, starting fresh.", e);
      return defaultState();
    }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
    }catch(e){
      console.warn("MANDING: failed to persist state.", e);
      enqueueToast("저장하지 못했어요, 다시 시도해주세요");
    }
  }

  var appState = loadState();

  /* UI (non-persisted) navigation state */
  var ui = { view: "home", pastDetailDate: null, editMode: false, homeTab: "growing" };
  var modalContext = null;
  var dragState = null; // { startIndex, currentIndex, rowEl, listEl, rows, rowHeight, startY }

  /* ---------------------------------------------------------------------
   * Business logic
   * ------------------------------------------------------------------- */
  function findCluster(id){
    return appState.clusters.filter(function(c){ return c.id === id; })[0];
  }

  // Moves the growing cluster at fromIndex to toIndex, both positions within the
  // growing-only subset, then re-threads the result back into the real
  // appState.clusters array so every graduated cluster keeps its exact original
  // absolute slot — graduated clusters are interleaved in storage but excluded
  // from reordering entirely.
  function commitClusterReorder(fromIndex, toIndex){
    var growing = appState.clusters.filter(function(c){ return !c.graduated; });
    if (fromIndex < 0 || fromIndex >= growing.length || fromIndex === toIndex){ render(); return; }
    if (toIndex < 0) toIndex = 0;
    if (toIndex >= growing.length) toIndex = growing.length - 1;

    var moved = growing.splice(fromIndex, 1)[0];
    growing.splice(toIndex, 0, moved);

    var queue = growing.slice();
    appState.clusters = appState.clusters.map(function(c){
      return c.graduated ? c : queue.shift();
    });

    saveState();
    render();
  }

  function createCluster(name){
    var cluster = {
      id: genId(),
      name: name,
      grapeCount: 0,
      grapeDates: [],
      grapeVariants: [],
      pendingSteps: [],
      lastFilledDate: null,
      graduated: false,
      lastCheckedDate: null,
      createdAt: todayStr(),
      memoEntries: []
    };
    appState.clusters.unshift(cluster);
    saveState();
  }

  // Lets a user register a routine they already have going, straight into the
  // 루틴 체크리스트 — skips the grow-a-젤리주머니 metaphor entirely, since it doesn't
  // fit something that isn't actually a new habit being formed. Grape history is
  // simply unknown (all null dates), same as any legacy grape earned pre-dating
  // the grapeDates feature.
  function createRoutine(name){
    var cluster = {
      id: genId(),
      name: name,
      grapeCount: MAX_GRAPES,
      grapeDates: new Array(MAX_GRAPES).fill(null),
      grapeVariants: new Array(MAX_GRAPES).fill(0).map(randomJellyVariant),
      pendingSteps: [],
      lastFilledDate: null,
      graduated: true,
      lastCheckedDate: null,
      createdAt: todayStr(),
      memoEntries: []
    };
    appState.clusters.unshift(cluster);
    saveState();
  }

  // Queue a new "작은 행동" without disturbing whatever's already queued — the
  // input stays open (FR-5 revision) so several can be queued back to back. This
  // list is a personal to-do log now, fully decoupled from grape-earning: items
  // are never removed or completed by the grape flow, only by [삭제] below.
  function addPendingStep(id, text){
    var c = findCluster(id);
    if (!c || c.graduated) return;
    var trimmed = String(text == null ? "" : text).trim();
    if (!trimmed) return;
    c.pendingSteps.push({ id: genId(), text: trimmed, doneDate: null });
    saveState();
  }

  function findStepOwner(stepId){
    for (var i = 0; i < appState.clusters.length; i++){
      var c = appState.clusters[i];
      for (var j = 0; j < c.pendingSteps.length; j++){
        if (c.pendingSteps[j].id === stepId) return { cluster: c, index: j, step: c.pendingSteps[j] };
      }
    }
    return null;
  }

  function renameCluster(id, name){
    var c = findCluster(id);
    if (!c) return;
    var trimmed = String(name == null ? "" : name).trim();
    if (!trimmed) return;
    c.name = trimmed;
    saveState();
  }

  // "젤리를 위한 작은 체크리스트" 옆 메모는 날짜별로 쌓이는 개인 기록 로그 —
  // 하루에 여러 건 남길 수 있고, 저장한 각 항목은 나중에 따로 수정/삭제 가능.
  function addMemoEntry(id, text){
    var c = findCluster(id);
    if (!c) return;
    var trimmed = String(text == null ? "" : text).trim();
    if (!trimmed) return;
    c.memoEntries.push({ id: genId(), date: todayStr(), text: trimmed });
    saveState();
  }

  function findMemoEntryOwner(entryId){
    for (var i = 0; i < appState.clusters.length; i++){
      var c = appState.clusters[i];
      for (var j = 0; j < c.memoEntries.length; j++){
        if (c.memoEntries[j].id === entryId) return { cluster: c, index: j, entry: c.memoEntries[j] };
      }
    }
    return null;
  }

  function editMemoEntry(entryId, text){
    var owner = findMemoEntryOwner(entryId);
    if (!owner) return;
    var trimmed = String(text == null ? "" : text).trim();
    if (!trimmed) return;
    owner.entry.text = trimmed;
    saveState();
  }

  function deleteMemoEntry(entryId){
    var owner = findMemoEntryOwner(entryId);
    if (!owner) return;
    owner.cluster.memoEntries.splice(owner.index, 1);
    saveState();
  }

  function editPendingStep(stepId, text){
    var owner = findStepOwner(stepId);
    if (!owner) return;
    var trimmed = String(text == null ? "" : text).trim();
    if (!trimmed) return;
    owner.step.text = trimmed;
    saveState();
  }

  function deletePendingStep(stepId){
    var owner = findStepOwner(stepId);
    if (!owner) return;
    owner.cluster.pendingSteps.splice(owner.index, 1);
    saveState();
  }

  // Personal "did it" marker — no grape, no toast, never removes the row. Scoped
  // to today's date so the check resets on day rollover while the item itself
  // (text) carries over unchanged.
  function toggleStepDone(stepId){
    var owner = findStepOwner(stepId);
    if (!owner) return;
    var today = todayStr();
    owner.step.doneDate = (owner.step.doneDate === today) ? null : today;
    saveState();
    render();
  }

  // FR-3/4/7/8/9/10 — the [수행 완료] button (or the next empty grape slot as a
  // shortcut) always earns a grape when tapped, regardless of the pending-steps
  // list content; the list is a separate personal log (see addPendingStep above).
  function attemptFillGrape(id){
    var c = findCluster(id);
    if (!c || c.graduated) return;

    var today = todayStr();
    if (c.lastFilledDate === today){
      // FR-4: daily cap already reached — calm inline message, no modal, no other toasts.
      enqueueToast("오늘 완료! 내일 만나요:D");
      return;
    }

    // Every queued 작은 행동 already checked today — that already answers the
    // confirm modal's question, so skip straight to the same effect as [Yes].
    if (c.pendingSteps.length > 0 && c.pendingSteps.every(function(s){ return s.doneDate === today; })){
      confirmCompleteCluster(id);
      return;
    }

    // "일주일 동안 보지않기" — while active, skip straight to the same effect as [Yes].
    if (appState.skipConfirmUntil && today <= appState.skipConfirmUntil){
      confirmCompleteCluster(id);
      return;
    }

    openCompleteConfirmModal(id);
  }

  // Tapping an already-filled grape reports when that specific grape was earned,
  // instead of re-running the completion flow.
  function viewGrapeDate(id, indexStr){
    var c = findCluster(id);
    if (!c) return;
    var i = parseInt(indexStr, 10) - 1;
    var dateStr = c.grapeDates && c.grapeDates[i];
    enqueueToast(dateStr ? formatDateDots(dateStr) + "에 획득한 젤리예요:D" : "획득한 젤리예요:D");
  }

  // Undo for an accidental [수행 완료] tap, only reachable while today's grape is
  // still the one just earned. Reverses the grape/date/graduation/dailyTotals side
  // effects; leaves allTimeMax and the FR-9/10 once-per-day flags untouched (low-
  // stakes bookkeeping, not worth the complexity of perfectly rewinding).
  function cancelTodayComplete(id){
    var c = findCluster(id);
    if (!c) return;
    var today = todayStr();
    if (c.lastFilledDate !== today) return;

    if (c.graduated){
      // Can only have graduated today if this same tap pushed it to the cap.
      c.graduated = false;
      c.lastCheckedDate = null;
    }

    c.grapeCount = Math.max(0, c.grapeCount - 1);
    c.grapeDates.pop();
    c.grapeVariants.pop();
    c.lastFilledDate = null;

    if (appState.dailyTotals[today]){
      appState.dailyTotals[today] = Math.max(0, appState.dailyTotals[today] - 1);
    }

    saveState();
    render();
    enqueueToast("잘못 눌렀나요? 젤리를 반납했어요.");
  }

  function confirmCompleteCluster(id){
    var c = findCluster(id);
    if (!c || c.graduated) return;

    var today = todayStr();
    if (c.lastFilledDate === today){
      enqueueToast("오늘 완료! 내일 만나요:D");
      return;
    }

    c.grapeCount = Math.min(MAX_GRAPES, c.grapeCount + 1);
    c.lastFilledDate = today;
    c.grapeDates.push(today); // stays index-aligned with grapeCount, read by tapping a filled grape
    c.grapeVariants.push(randomJellyVariant()); // which of the 3 jelly looks this slot renders, picked once and kept

    // Confirming "Yes" checks off every queued 작은 행동 for today, not just the grape.
    c.pendingSteps.forEach(function(s){ s.doneDate = today; });

    appState.dailyTotals[today] = (appState.dailyTotals[today] || 0) + 1;
    var todayTotal = appState.dailyTotals[today];
    var yesterdayTotal = appState.dailyTotals[yesterdayOf(today)] || 0;
    if (!appState.dailyToast[today]) appState.dailyToast[today] = { surpassedShown: false, recordShown: false };

    saveState();
    render();

    // FR-7: fires on every grape-earning tap.
    enqueueToast("오늘의 젤리 획득!");

    // FR-9 vs FR-10 mutual exclusion: record toast wins if both conditions are true this tap.
    // Both toasts are gated to at most once per calendar day (dailyToast[today].*Shown) — without
    // the recordShown gate, allTimeMax gets bumped to todayTotal on every record-setting tap, which
    // keeps `todayTotal >= allTimeMax` true (equality) on every later tap that same day and would
    // otherwise re-fire the 🏆 toast repeatedly instead of just once.
    var isRecordCondition = todayTotal >= appState.allTimeMax;
    if (isRecordCondition){
      appState.allTimeMax = todayTotal;
    }

    if (isRecordCondition && !appState.dailyToast[today].recordShown){
      appState.dailyToast[today].recordShown = true;
      saveState();
      enqueueToast("🏆 역대 최고 기록이에요!");
    } else if (todayTotal > yesterdayTotal && !appState.dailyToast[today].surpassedShown){
      appState.dailyToast[today].surpassedShown = true;
      saveState();
      enqueueToast("🎉 어제를 넘었어요!");
    } else if (isRecordCondition){
      // Record condition true but already celebrated today — still persist the updated max.
      saveState();
    }
  }

  // FR-13, now a deliberate tap instead of automatic: reaching MAX_GRAPES no
  // longer graduates the cluster by itself, since doing so immediately moved
  // the card out of the growing list and made [취소] unreachable for that same
  // tap (a bug caught during testing). The card now waits at the cap, showing
  // [취소] (while it's still today's fill) above a full-width prompt button —
  // graduation only happens once the user taps that button themselves.
  function graduateCluster(id){
    var c = findCluster(id);
    if (!c || c.graduated || c.grapeCount < MAX_GRAPES) return;
    c.graduated = true;
    c.lastCheckedDate = null;
    saveState();
    render();
  }

  // FR-15: checking a routine item is grape/toast-independent. Tapping an
  // already-checked row today toggles it back off — an accidental tap isn't
  // stuck until tomorrow.
  function checkChecklistItem(id){
    var c = findCluster(id);
    if (!c || !c.graduated) return;
    var today = todayStr();
    c.lastCheckedDate = (c.lastCheckedDate === today) ? null : today;
    saveState();
    render();
  }

  // FR-16 [다시 도전하기]
  function retryChecklistItem(id){
    var idx = -1;
    for (var i = 0; i < appState.clusters.length; i++){
      if (appState.clusters[i].id === id && appState.clusters[i].graduated){ idx = i; break; }
    }
    if (idx === -1) return;
    var name = appState.clusters[idx].name;
    var memoEntries = appState.clusters[idx].memoEntries || [];
    appState.clusters.splice(idx, 1);
    appState.clusters.unshift({
      id: genId(),
      name: name,
      grapeCount: 0,
      grapeDates: [],
      grapeVariants: [],
      pendingSteps: [],
      lastFilledDate: null,
      graduated: false,
      lastCheckedDate: null,
      createdAt: todayStr(),
      memoEntries: memoEntries
    });
    saveState();
  }

  // FR-16 [삭제하기]
  function deleteChecklistItem(id){
    var idx = -1;
    for (var i = 0; i < appState.clusters.length; i++){
      if (appState.clusters[i].id === id && appState.clusters[i].graduated){ idx = i; break; }
    }
    if (idx === -1) return;
    appState.clusters.splice(idx, 1);
    saveState();
  }

  // Mirror of deleteChecklistItem, but for a growing (non-graduated) cluster
  // reached via the card's own ⋯ menu instead of the routine checklist's.
  function deleteCluster(id){
    var c = findCluster(id);
    if (!c || c.graduated) return;
    var idx = appState.clusters.indexOf(c);
    if (idx === -1) return;
    appState.clusters.splice(idx, 1);
    saveState();
  }

  // FR-19
  function saveReview(date, fields){
    appState.reviews[date] = {
      good: fields.good || "",
      improve: fields.improve || "",
      gratitude: fields.gratitude || "",
      affirmation: fields.affirmation || "",
      savedAt: Date.now()
    };
    saveState();
  }

  /* ---------------------------------------------------------------------
   * Toast queue (FR-7 / FR-9 / FR-10 / FR-4 cap message) — lives outside
   * #app so full re-renders never interrupt an in-flight toast.
   * ------------------------------------------------------------------- */
  var toastQueue = [];
  var toastShowing = false;

  function enqueueToast(text){
    toastQueue.push(text);
    processToastQueue();
  }

  function processToastQueue(){
    if (toastShowing || toastQueue.length === 0) return;
    toastShowing = true;
    var text = toastQueue.shift();
    var region = document.getElementById("toast-region");
    var el = document.createElement("div");
    el.className = "toast-celebration";
    el.setAttribute("role", "status");
    el.textContent = text;
    region.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("toast-visible"); });
    setTimeout(function(){
      el.classList.remove("toast-visible");
      setTimeout(function(){
        el.remove();
        toastShowing = false;
        processToastQueue();
      }, 250);
    }, 1800);
  }

  /* ---------------------------------------------------------------------
   * Rendering
   * ------------------------------------------------------------------- */
  function renderGrapeGrid(cluster){
    var idx = 0;
    var rowsHtml = GRAPE_ROWS.map(function(count){
      var slots = "";
      for (var i = 0; i < count; i++){
        idx++;
        var filled = idx <= cluster.grapeCount;
        // A filled slot reports the date it was earned instead of trying to earn another.
        var action = filled ? "view-grape-date" : "fill-grape";
        var variantClass = filled ? " grape-filled-v" + (cluster.grapeVariants[idx - 1] || 0) : "";
        slots += '<button type="button" class="grape-slot ' + (filled ? "grape-filled" : "grape-empty") + variantClass +
          '" data-action="' + action + '" data-id="' + cluster.id + '" data-index="' + idx + '" aria-label="젤리, ' + idx + '번째, ' +
          (filled ? "완료" : "비어있음") + '"></button>';
      }
      return '<div class="grape-row">' + slots + "</div>";
    }).join("");
    return '<div class="grape-grid">' + rowsHtml + "</div>";
  }

  function renderPendingStepRow(step, today, locked){
    // The toggle is a personal "did it" marker only — no grape, no removal, per
    // user decision. Grape-earning lives solely in the [수행 완료] button below.
    // It's scoped to today's date, so it resets on day rollover (deferred-work.md
    // note about undo no longer applies here — this toggle was always reversible).
    var doneToday = step.doneDate === today;
    // Once today's grape is earned, the whole log locks — flat gray, text-only,
    // no toggle/menu — so a claimed day's checklist can't quietly be re-edited.
    // [취소] (beside [수행 완료]) is the only way back into it before tomorrow.
    if (locked){
      return (
        '<div class="checklist-row checklist-row-locked">' +
          '<span class="body checklist-name">' + esc(step.text) + "</span>" +
        "</div>"
      );
    }
    return (
      '<div class="checklist-row">' +
        '<span class="body checklist-name">' + esc(step.text) + "</span>" +
        '<button type="button" class="step-toggle' + (doneToday ? " step-toggle-on" : "") +
          '" data-action="toggle-step-done" data-id="' + step.id + '" aria-pressed="' + (doneToday ? "true" : "false") +
          '" aria-label="' + esc(step.text) + (doneToday ? ", 완료 표시됨" : ", 완료 표시 안 됨") + '">' +
          (doneToday ? "✓" : "") +
        "</button>" +
        '<button type="button" class="overflow-btn" data-action="pending-step-menu" data-id="' + step.id +
          '" aria-label="걸음 옵션 더보기">⋯</button>' +
      "</div>"
    );
  }

  function renderClusterCard(c){
    var today = todayStr();
    var inputHtml =
      '<div class="step-row step-row-input">' +
        '<input type="text" class="step-input" data-id="' + c.id + '" aria-label="현재 걸음 입력" placeholder="작게 시작해볼까요?" maxlength="60">' +
        '<button type="button" class="step-confirm-btn" data-action="commit-step" data-id="' + c.id +
          '" aria-label="걸음 저장">✓</button>' +
      "</div>";
    // "젤리를 위한 작은 체크리스트" is a personal to-do log, decoupled from jelly-earning — always
    // renders (even with zero items). New entries append to the bottom (push()).
    // Once today's grape is earned, [수행 완료] steps aside entirely — [취소] is
    // the only action left, since re-tapping the completion flow makes no sense
    // for an already-claimed day.
    var grapeEarnedToday = c.lastFilledDate === today;
    // Reaching the cap doesn't auto-graduate anymore (see graduateCluster) — the
    // card waits here with [취소] (only while today's fill is still undoable)
    // stacked above an explicit "move to routine" prompt.
    var atCap = c.grapeCount >= MAX_GRAPES;
    var cancelBtnHtml = '<button type="button" class="btn-secondary step-cancel-btn-solo" data-action="cancel-complete" data-id="' + c.id + '">취소</button>';
    var completeRowHtml;
    if (atCap){
      completeRowHtml = (grapeEarnedToday ? cancelBtnHtml : "") +
        '<button type="button" class="btn-primary step-graduate-btn" data-action="graduate-cluster" data-id="' + c.id + '">젤리를 다 모았어요! 루틴으로 이동!</button>';
    } else if (grapeEarnedToday){
      completeRowHtml = cancelBtnHtml;
    } else {
      completeRowHtml = '<button type="button" class="btn-primary step-complete-cta" data-action="fill-grape" data-id="' + c.id + '">수행 완료</button>';
    }
    var pendingHtml =
      '<p class="caption section-label pending-steps-label">젤리를 위한 작은 체크리스트</p>' +
      '<div class="pending-steps">' + c.pendingSteps.map(function(s){ return renderPendingStepRow(s, today, grapeEarnedToday); }).join("") + "</div>" +
      '<div class="complete-row' + (atCap ? " complete-row-stacked" : "") + '">' + completeRowHtml + "</div>";
    return (
      '<div class="cluster-card">' +
        '<div class="cluster-card-header">' +
          '<span class="cluster-header-spacer" aria-hidden="true"></span>' +
          '<h2 class="body cluster-name">' + esc(c.name) + "</h2>" +
          '<button type="button" class="overflow-btn' + (c.memoEntries.length > 0 ? " has-memo" : "") + '" data-action="cluster-menu" data-id="' + c.id +
            '" aria-label="젤리주머니 옵션 더보기">⋯</button>' +
        "</div>" +
        renderGrapeGrid(c) +
        '<p class="caption grape-caption">' + c.grapeCount + "/" + MAX_GRAPES + "</p>" +
        inputHtml +
        pendingHtml +
      "</div>"
    );
  }

  // Checked state is the only visual cue now: a checked row gets the light-purple
  // tint plus a filled checkbox; unchecked stays white with an empty checkbox
  // outline. Replaces the earlier "next-due" highlight — that and "checked" were
  // easy to confuse when both could paint the same tint.
  function renderChecklistRow(item, today){
    var checkedToday = item.lastCheckedDate === today;
    var stateLabel = checkedToday ? "완료" : "미완료";
    // NOTE: outer element is a <div role="button"> (not a native <button>) because it
    // must contain the nested overflow <button> — buttons cannot legally contain other
    // interactive descendants per the HTML content model.
    return (
      '<div class="checklist-row' + (checkedToday ? " checklist-row-checked" : "") +
        '" data-action="check-item" data-id="' + item.id + '" role="button" tabindex="0" ' +
        'aria-label="' + esc(item.name) + ", " + stateLabel + '">' +
        '<span class="body checklist-name">' + esc(item.name) + "</span>" +
        '<span class="checklist-status' + (checkedToday ? " checklist-status-checked" : "") + '" aria-hidden="true">' +
          (checkedToday ? "✓" : "") +
        "</span>" +
        '<button type="button" class="overflow-btn" data-action="checklist-menu" data-id="' + item.id +
          '" aria-label="루틴 옵션 더보기">⋯</button>' +
      "</div>"
    );
  }

  // No inner header (label + add button) — the 젤리밭/루틴 tab switcher and the
  // shared home-header "+ 추가" button (tab-aware) cover both jobs now, so this
  // is just the recessed-background zone wrapping the rows themselves.
  function renderChecklistSection(graduatedList, today){
    var body = graduatedList.length > 0
      ? '<div class="checklist-rows">' + graduatedList.map(function(item){
          return renderChecklistRow(item, today);
        }).join("") + "</div>"
      : '<p class="body empty-hint">아직 등록한 루틴이 없어요.</p>';
    return '<div class="checklist-section">' + body + "</div>";
  }

      return '<button type="button" class="home-tab-btn' + (active ? " home-tab-btn-active" : "") +
        '" data-action="switch-home-tab" data-tab="' + key + '" aria-pressed="' + (active ? "true" : "false") + '">' +
        label + "</button>";
    }
    return '<div class="home-tabs">' + tabBtn("growing", "젤리밭") + tabBtn("routine", "루틴") + "</div>";

  function renderHome(){
    if (appState.clusters.length === 0){
      return (
        '<div class="empty-screen">' +
          '<h1 class="title">아직 키우는 젤리주머니가 없어요</h1>' +

        "</div>"
      );
    }

    var today = todayStr();
    var growing = appState.clusters.filter(function(c){ return !c.graduated; });
    var graduated = appState.clusters.filter(function(c){ return c.graduated; });
    var editMode = ui.editMode;
    var tab = ui.homeTab === "routine" ? "routine" : "growing";
    var addAction = tab === "routine" ? "open-new-routine" : "open-new-cluster";

    var html = "";
    html += '<div class="home-header">' +
      '<h1 class="title">Routine Maker</h1>' +
      '<div class="header-actions">' +
        (editMode
          ? '<button type="button" class="link-btn" data-action="toggle-edit-mode">완료</button>'
          : ('<button type="button" class="link-btn" data-action="open-past-reviews">지난 리뷰</button>' +
             (tab === "growing" && growing.length >= 2 ? '<button type="button" class="link-btn" data-action="toggle-edit-mode">편집</button>' : "") +
             '<button type="button" class="btn-compact" data-action="' + addAction + '">+ 추가</button>')) +
      "</div>" +
    "</div>";
    if (editMode){
      html += '<p class="micro summary-line">' + growing.length + "개의 젤리주머니 키우는 중</p>";
      html += '<div class="cluster-edit-list">' + growing.map(renderClusterEditRow).join("") + "</div>";
      return html;
    }
    html += renderHomeTabs(tab);
    if (tab === "growing"){
      html += '<p class="micro summary-line">' + growing.length + "개의 젤리주머니 키우는 중</p>";
      html += growing.length > 0
        ? '<div class="cluster-list">' + growing.map(renderClusterCard).join("") + "</div>"
        : '<p class="body empty-hint">아직 키우는 젤리주머니가 없어요.</p>';
    } else {
      html += '<p class="micro summary-line">' + graduated.length + "개의 루틴 관리 중</p>";
      html += renderChecklistSection(graduated, today);
    }
    html += '<button type="button" class="btn-primary finish-btn" data-action="open-review">오늘 완료하기</button>';
    return html;
  }

  function render(){

    app.className = "view-" + ui.view;
    if (ui.view === "review") app.innerHTML = renderReview();
    else if (ui.view === "pastList") app.innerHTML = renderPastList();

    else app.innerHTML = renderHome();
    attachDynamicListeners();

  function attachDynamicListeners(){
    var inputs = document.querySelectorAll(".step-input");
    for (var i = 0; i < inputs.length; i++){
      (function(inp){
        inp.addEventListener("keydown", function(e){
          if (e.key === "Enter"){ e.preventDefault(); commitStepFromInput(inp.dataset.id); }
        });
      })(inputs[i]);
    }
  }

  function commitStepFromInput(id){
    var input = document.querySelector('.step-input[data-id="' + id + '"]');
    if (!input) return;
    var val = input.value.trim();
    if (!val) return;
    addPendingStep(id, val);
    render();
    // Input persists across the commit (per user request) — refocus the fresh
    // element so the next 작은 행동 can be typed without an extra tap.
    var newInput = document.querySelector('.step-input[data-id="' + id + '"]');
    if (newInput) newInput.focus();
  }

  function saveReviewFromForm(){
    var today = todayStr();
    var g = function(id){ var el = document.getElementById(id); return el ? el.value : ""; };
    saveReview(today, {
      good: g("review-good"),
      improve: g("review-improve"),
      gratitude: g("review-gratitude"),
      affirmation: g("review-affirmation")
    });
    ui.view = "home";
    render();
  }

    if (!c) return;
    modalContext = { type: "clusterMemo", clusterId: id };
    var entriesHtml = c.memoEntries.length > 0
      ? '<div class="memo-entries">' + c.memoEntries.map(renderMemoEntry).join("") + "</div>"
      : '<p class="body empty-hint">아직 남긴 메모가 없어요.</p>';
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal-sheet memo-sheet">' +
          '<h2 class="title">메모</h2>' +
          entriesHtml +
          '<textarea id="cluster-memo-input" placeholder="이 젤리주머니에 대해 기록해두고 싶은 게 있나요?" maxlength="500"></textarea>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" data-action="close-modal">닫기</button>' +
            '<button type="button" class="btn-primary" data-action="confirm-cluster-memo">추가</button>' +
          "</div>" +
        "</div>" +
      "</div>";
    document.getElementById("cluster-memo-input").focus();
  }

  function confirmClusterMemo(){
    if (!modalContext || modalContext.type !== "clusterMemo") return;
    var ta = document.getElementById("cluster-memo-input");
    if (!ta) return;
    addMemoEntry(modalContext.clusterId, ta.value);
    openMemoModal(modalContext.clusterId);
  }

  function openMemoEntryMenu(entryId){
    var owner = findMemoEntryOwner(entryId);
    if (!owner) return;
    modalContext = { type: "memoEntryMenu", clusterId: owner.cluster.id, entryId: entryId };
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal-sheet action-sheet">' +
          '<button type="button" class="sheet-btn" data-action="menu-edit-memo-entry">수정</button>' +
          '<button type="button" class="sheet-btn sheet-btn-muted" data-action="delete-memo-entry">삭제</button>' +
          '<button type="button" class="sheet-btn sheet-btn-cancel" data-action="back-to-memo">취소</button>' +
        "</div>" +
      "</div>";
  }

  function openEditMemoEntryModal(entryId){
    var owner = findMemoEntryOwner(entryId);
    if (!owner) return;
    modalContext = { type: "editMemoEntry", clusterId: owner.cluster.id, entryId: entryId };
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal-sheet">' +
          '<h2 class="title">메모를 새로 써볼까요?</h2>' +
          '<textarea id="edit-memo-entry-input" maxlength="500">' + esc(owner.entry.text) + "</textarea>" +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" data-action="back-to-memo">취소</button>' +
            '<button type="button" class="btn-primary" data-action="confirm-edit-memo-entry">저장</button>' +
          "</div>" +
        "</div>" +
      "</div>";
    var input = document.getElementById("edit-memo-entry-input");
    input.focus();
  }

  function confirmEditMemoEntry(){
    if (!modalContext || modalContext.type !== "editMemoEntry") return;
    var ta = document.getElementById("edit-memo-entry-input");
    if (!ta) return;
    editMemoEntry(modalContext.entryId, ta.value);
    openMemoModal(modalContext.clusterId);
  }

  function performDeleteMemoEntry(){
    if (!modalContext || modalContext.type !== "memoEntryMenu") return;
    deleteMemoEntry(modalContext.entryId);
    openMemoModal(modalContext.clusterId);
  }

  function performDeleteCluster(){
    if (!modalContext || modalContext.type !== "clusterMenu") return;
    var c = findCluster(modalContext.clusterId);
    var name = c ? c.name : "";
    var ok = window.confirm('"' + name + '" 젤리주머니를 삭제할까요? 되돌릴 수 없어요.');
    if (ok) deleteCluster(modalContext.clusterId);
    closeModal();
    render();
  }

  // Confirmation gate in front of the [수행 완료] grape award, per user request.
  function openCompleteConfirmModal(id){
    modalContext = { type: "completeConfirm", clusterId: id };
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal-sheet">' +
          '<h2 class="title">작은 할 일들을 다 완료했나요?</h2>' +
          '<p class="body">했다면 아래 버튼을 눌러주세요.</p>' +
          '<div class="modal-checkbox-group">' +
            '<label class="modal-checkbox-row">' +
              '<input type="checkbox" id="skip-confirm-day">' +
              '<span class="body">하루 동안 보지 않기</span>' +
            "</label>" +
            '<label class="modal-checkbox-row">' +
              '<input type="checkbox" id="skip-confirm-week">' +
              '<span class="body">일주일 간 보지 않기</span>' +
            "</label>" +
          "</div>" +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-secondary" data-action="close-modal">취소</button>' +
            '<button type="button" class="btn-primary" data-action="confirm-complete">Yes</button>' +
          "</div>" +
        "</div>" +
      "</div>";
    var dayCheckbox = document.getElementById("skip-confirm-day");
    var weekCheckbox = document.getElementById("skip-confirm-week");
    dayCheckbox.addEventListener("change", function(){
      if (dayCheckbox.checked) weekCheckbox.checked = false;
    });
    weekCheckbox.addEventListener("change", function(){
      if (weekCheckbox.checked) dayCheckbox.checked = false;
    });
  }

  function confirmComplete(){
    if (!modalContext || modalContext.type !== "completeConfirm") return;
    var id = modalContext.clusterId;
    var dayCheckbox = document.getElementById("skip-confirm-day");
    var weekCheckbox = document.getElementById("skip-confirm-week");
    if (dayCheckbox && dayCheckbox.checked){
      appState.skipConfirmUntil = addDays(todayStr(), 1);
      saveState();
    } else if (weekCheckbox && weekCheckbox.checked){
      appState.skipConfirmUntil = addDays(todayStr(), 7);
      saveState();
    }
    closeModal();
    confirmCompleteCluster(id);
  }

  function openChecklistMenu(id){
    modalContext = { type: "checklistMenu", clusterId: id };
    document.getElementById("modal-root").innerHTML =
      '<div class="modal-backdrop">' +
        '<div class="modal-sheet action-sheet">' +
          '<button type="button" class="sheet-btn" data-action="retry-item">다시 도전하기</button>' +
          '<button type="button" class="sheet-btn sheet-btn-muted" data-action="delete-item">삭제하기</button>' +
          '<button type="button" class="sheet-btn sheet-btn-cancel" data-action="close-modal">취소</button>' +
        "</div>" +
      "</div>";
  }

  function performRetryChecklistItem(){
    if (!modalContext || modalContext.type !== "checklistMenu") return;
    var c = findCluster(modalContext.clusterId);
    var name = c ? c.name : "";
    var ok = window.confirm('"' + name + '"을(를) 0/' + MAX_GRAPES + '부터 다시 시작할까요?');
    if (ok) retryChecklistItem(modalContext.clusterId);
    closeModal();
    render();
  }

  function performDeleteChecklistItem(){
    if (!modalContext || modalContext.type !== "checklistMenu") return;
    var c = findCluster(modalContext.clusterId);
    var name = c ? c.name : "";
    var ok = window.confirm('"' + name + '" 항목을 삭제할까요? 되돌릴 수 없어요.');
    if (ok) deleteChecklistItem(modalContext.clusterId);
    closeModal();
    render();
  }

  /* ---------------------------------------------------------------------
   * Event delegation
   * ------------------------------------------------------------------- */
  document.getElementById("app").addEventListener("click", function(e){
    var act = e.target.closest("[data-action]");
    if (!act) return;
    var id = act.dataset.id;
    switch (act.dataset.action){
      case "open-new-cluster": openNewClusterModal(); break;
      case "open-new-routine": openNewRoutineModal(); break;
      case "toggle-edit-mode": ui.editMode = !ui.editMode; render(); break;
      case "switch-home-tab": ui.homeTab = act.dataset.tab; ui.editMode = false; render(); break;
      case "open-past-reviews": ui.view = "pastList"; render(); break;
      case "open-review": ui.view = "review"; render(); break;
      case "back-home": ui.view = "home"; render(); break;
      case "fill-grape": attemptFillGrape(id); break;
      case "view-grape-date": viewGrapeDate(id, act.dataset.index); break;
      case "cancel-complete": cancelTodayComplete(id); break;
      case "graduate-cluster": graduateCluster(id); break;
      case "commit-step": commitStepFromInput(id); break;
      case "toggle-step-done": toggleStepDone(id); break;
      case "pending-step-menu": openPendingStepMenu(id); break;
      case "cluster-menu": openClusterMenu(id); break;
      case "checklist-menu": openChecklistMenu(id); break;
      case "check-item": checkChecklistItem(id); break;
      case "open-past-detail": ui.view = "pastDetail"; ui.pastDetailDate = act.dataset.date; render(); break;
      case "save-review": saveReviewFromForm(); break;
    }
  });

  document.getElementById("app").addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.tagName === "BUTTON") return; // native buttons already activate on Enter/Space
    var act = e.target.closest('[role="button"][data-action]');
    if (!act) return;
    e.preventDefault();
    act.click();
  });

  // 편집 mode drag-to-reorder (replaces the old ▲▼ tap-swap buttons entirely,
  // per user request). Pointer Events unify mouse/touch/pen; the whole row is
  // the drag surface. Live reflow previews via transform on siblings; the real
  // appState.clusters array is only mutated once, on drop.
  document.getElementById("app").addEventListener("pointerdown", function(e){
    var row = e.target.closest(".cluster-edit-row");
    if (!row) return;
    var listEl = row.closest(".cluster-edit-list");
    if (!listEl) return;

    var rows = Array.prototype.slice.call(listEl.querySelectorAll(".cluster-edit-row"));
    if (rows.length < 2) return; // nothing to reorder

    var startIndex = rows.indexOf(row);
    if (startIndex === -1) return;

    var rowRect = row.getBoundingClientRect();
    var listStyle = getComputedStyle(listEl);
    var gap = parseFloat(listStyle.rowGap || listStyle.gap || "0") || 0;

    dragState = {
      startIndex: startIndex,
      currentIndex: startIndex,
      rowEl: row,
      rows: rows,
      rowHeight: rowRect.height + gap,
      startY: e.clientY
    };

    row.setPointerCapture(e.pointerId);
    row.classList.add("dragging");
    row.style.transition = "none";
  });

  document.getElementById("app").addEventListener("pointermove", function(e){
    if (!dragState) return;
    var deltaY = e.clientY - dragState.startY;
    dragState.rowEl.style.transform = "translateY(" + deltaY + "px)";

    var targetIndex = dragState.startIndex + Math.round(deltaY / dragState.rowHeight);
    if (targetIndex < 0) targetIndex = 0;
    if (targetIndex > dragState.rows.length - 1) targetIndex = dragState.rows.length - 1;
    dragState.currentIndex = targetIndex;

    dragState.rows.forEach(function(r, i){
      if (r === dragState.rowEl) return;
      r.style.transition = "transform .15s ease";
      var displaced = 0;
      if (dragState.startIndex < targetIndex && i > dragState.startIndex && i <= targetIndex){
        displaced = -1; // slides up to fill the gap the dragged row left behind
      } else if (dragState.startIndex > targetIndex && i >= targetIndex && i < dragState.startIndex){
        displaced = 1; // slides down
      }
      r.style.transform = displaced === 0 ? "" : "translateY(" + (displaced * dragState.rowHeight) + "px)";
    });
  });

  function finishClusterDrag(){
    if (!dragState) return;
    var startIndex = dragState.startIndex;
    var targetIndex = dragState.currentIndex;
    dragState = null;
    commitClusterReorder(startIndex, targetIndex); // no-ops to a clean render() if unchanged
  }

  document.getElementById("app").addEventListener("pointerup", finishClusterDrag);
  document.getElementById("app").addEventListener("pointercancel", finishClusterDrag);

  document.getElementById("modal-root").addEventListener("click", function(e){
    if (e.target.classList.contains("modal-backdrop")){ closeModal(); return; }
    var act = e.target.closest("[data-action]");
    if (!act) return;
    switch (act.dataset.action){
      case "close-modal": closeModal(); render(); break;
      case "confirm-new-cluster": confirmNewCluster(); break;
      case "confirm-new-routine": confirmNewRoutine(); break;
      case "confirm-edit-pending-step": confirmEditPendingStep(); break;
      case "delete-pending-step": performDeletePendingStep(); break;
      case "menu-edit-pending-step": openEditPendingStepModal(modalContext.stepId); break;
      case "menu-rename-cluster": openRenameClusterModal(modalContext.clusterId); break;
      case "confirm-rename-cluster": confirmRenameCluster(); break;
      case "menu-edit-memo": openMemoModal(modalContext.clusterId); break;
      case "confirm-cluster-memo": confirmClusterMemo(); break;
      case "memo-entry-menu": openMemoEntryMenu(act.dataset.id); break;
      case "back-to-memo": openMemoModal(modalContext.clusterId); break;
      case "menu-edit-memo-entry": openEditMemoEntryModal(modalContext.entryId); break;
      case "confirm-edit-memo-entry": confirmEditMemoEntry(); break;
      case "delete-memo-entry": performDeleteMemoEntry(); break;
      case "delete-cluster": performDeleteCluster(); break;
      case "confirm-complete": confirmComplete(); break;
      case "retry-item": performRetryChecklistItem(); break;
      case "delete-item": performDeleteChecklistItem(); break;
    }
  });

  /* ---------------------------------------------------------------------
   * Init
   * ------------------------------------------------------------------- */
  function init(){ render(); }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
